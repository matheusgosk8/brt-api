name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  FUNCTION_NAME: brt-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (webpack)
        run: npm run build

      - name: Package zip
        run: |
          cd dist
          zip -r ../function.zip .
          ls -lh ../function.zip

      - uses: actions/upload-artifact@v4
        with:
          name: function-zip
          path: function.zip
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-zip

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3 + update Lambda
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="brt-api-deploy-${ACCOUNT_ID}-${AWS_REGION}"
          KEY="brt-api/${GITHUB_SHA}.zip"

          aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null \
            || aws s3 mb "s3://${BUCKET}" --region "${AWS_REGION}"

          aws s3 cp function.zip "s3://${BUCKET}/${KEY}"

          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --s3-bucket "${BUCKET}" \
            --s3-key "${KEY}" \
            --publish

          aws lambda wait function-updated --function-name "${FUNCTION_NAME}"

          # Neon via secret (jq evita quebrar com ?&= na URL)
          jq -n \
            --arg db "${DATABASE_URL}" \
            '{Variables:{DATABASE_URL:$db,CORS_ORIGIN:"*",LOG_LEVEL:"INFO",PORT:"3001",DB_POOL_MAX:"2"}}' \
            > /tmp/lambda-env.json

          aws lambda update-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --environment file:///tmp/lambda-env.json

          aws lambda wait function-updated --function-name "${FUNCTION_NAME}"
          rm -f /tmp/lambda-env.json

          echo "Deployed ${KEY} → ${FUNCTION_NAME}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
